<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trocar senha — Biblioteca Comunitária</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1 data-i18n="brand">📚 Biblioteca Comunitária</h1>
      <nav>
        <span id="lang-mount"></span>
        <a href="dashboard.html" data-i18n="nav_panel">Meu painel</a>
        <button id="logout" data-i18n="nav_logout">Sair</button>
      </nav>
    </header>
    <main>
      <div class="card" style="max-width: 420px; margin: 0 auto">
        <h2 data-i18n="change_title">Trocar senha</h2>
        <form id="change-form">
          <label for="old" data-i18n="f_old_password">Senha atual</label>
          <input id="old" type="password" required autocomplete="current-password" />

          <label for="new" data-i18n="f_new_password">Nova senha</label>
          <input id="new" type="password" required autocomplete="new-password" />

          <button class="btn" type="submit" data-i18n="btn_save">Salvar</button>
        </form>
        <div id="message"></div>
      </div>
    </main>
    <script type="module" src="/src/change-password.ts"></script>
  </body>
</html>
