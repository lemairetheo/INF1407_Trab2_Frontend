<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu painel — Biblioteca Comunitária</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>📚 Biblioteca Comunitária</h1>
      <nav>
        <span id="user-info" class="muted"></span>
        <a href="index.html">Início</a>
        <a href="change-password.html">Trocar senha</a>
        <button id="logout">Sair</button>
      </nav>
    </header>

    <main>
      <!-- Barre d'onglets : les onglets admin sont caches par defaut -->
      <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="catalog">Catálogo</button>
        <button class="tab" data-tab="account">Meus empréstimos</button>
        <button class="tab admin-tab" data-tab="moderation" hidden>
          Moderação
        </button>
        <button class="tab admin-tab" data-tab="admin-loans" hidden>
          Empréstimos
        </button>
        <button class="tab admin-tab" data-tab="admin-reservations" hidden>
          Reservas
        </button>
      </nav>

      <!-- Onglet : Catálogo (formulaire + liste) -->
      <section class="tab-panel" data-panel="catalog">
        <div class="card">
          <h2 id="form-title">Sugerir um livro</h2>
          <p id="form-hint" class="muted"></p>
          <form id="book-form">
            <input type="hidden" id="book-id" />
            <label for="title">Título</label>
            <input id="title" required />

            <label for="author">Autor</label>
            <input id="author" required />

            <label for="description">Descrição</label>
            <textarea id="description"></textarea>

            <label for="total_copies">Exemplares</label>
            <input id="total_copies" type="number" min="1" value="1" />

            <button class="btn" type="submit" id="submit-btn">Enviar</button>
            <button class="btn secondary" type="button" id="cancel-edit" hidden>
              Cancelar edição
            </button>
          </form>
          <div id="form-message"></div>
        </div>

        <div class="card">
          <h2>Catálogo</h2>
          <div id="books-list"><p class="muted">Carregando…</p></div>
        </div>
      </section>

      <!-- Onglet : compte de l'utilisateur (emprunts + reservas) -->
      <section class="tab-panel" data-panel="account" hidden>
        <div class="card">
          <h2>Meus empréstimos</h2>
          <div id="my-loans"></div>
        </div>
        <div class="card">
          <h2>Minhas reservas</h2>
          <div id="my-reservations"></div>
        </div>
      </section>

      <!-- Onglet admin : moderation -->
      <section class="tab-panel" data-panel="moderation" hidden>
        <div class="card">
          <h2>Aguardando aprovação</h2>
          <div id="pending-list"></div>
        </div>
      </section>

      <!-- Onglet admin : tous les emprunts -->
      <section class="tab-panel" data-panel="admin-loans" hidden>
        <div class="card">
          <h2>Todos os empréstimos</h2>
          <div id="all-loans"></div>
        </div>
      </section>

      <!-- Onglet admin : toutes les reservations -->
      <section class="tab-panel" data-panel="admin-reservations" hidden>
        <div class="card">
          <h2>Todas as reservas</h2>
          <div id="all-reservations"></div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
