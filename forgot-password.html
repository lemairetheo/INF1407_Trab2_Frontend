<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Esqueci minha senha — Biblioteca Comunitária</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="card">
        <div style="text-align: right"><span id="lang-mount"></span></div>
        <h2 data-i18n="forgot_title">Esqueci minha senha</h2>
        <p class="muted" data-i18n="forgot_desc">
          Informe seu email. Se houver uma conta, enviaremos um link de
          redefinição.
        </p>
        <form id="forgot-form">
          <label for="email" data-i18n="f_email">Email</label>
          <input id="email" type="email" required autocomplete="email" />
          <button class="btn" type="submit" data-i18n="btn_send_link">Enviar link</button>
        </form>
        <div id="message"></div>
        <p class="center-link">
          <a href="login.html" data-i18n="back_login">Voltar ao login</a>
        </p>
      </div>
    </div>
    <script type="module" src="/src/forgot-password.ts"></script>
  </body>
</html>
