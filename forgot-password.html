<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Esqueci minha senha — Biblioteca Comunitária</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="card">
        <h2>Esqueci minha senha</h2>
        <p class="muted">
          Informe seu email. Se houver uma conta, enviaremos um link de
          redefinição.
        </p>
        <form id="forgot-form">
          <label for="email">Email</label>
          <input id="email" type="email" required autocomplete="email" />
          <button class="btn" type="submit">Enviar link</button>
        </form>
        <div id="message"></div>
        <p class="center-link"><a href="login.html">Voltar ao login</a></p>
      </div>
    </div>
    <script type="module" src="/src/forgot-password.ts"></script>
  </body>
</html>
