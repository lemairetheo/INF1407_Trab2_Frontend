<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biblioteca Comunitária</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1 data-i18n="brand">📚 Biblioteca Comunitária</h1>
      <nav id="nav"><span id="lang-mount"></span></nav>
    </header>

    <main>
      <!-- Appel a l'action pour les visiteurs non connectes -->
      <div class="card" id="cta" hidden>
        <h2 data-i18n="welcome_title">Bem-vindo(a) à Biblioteca Comunitária</h2>
        <p data-i18n="welcome_text">
          Explore livremente o catálogo abaixo. Quer sugerir um livro ou deixar
          uma avaliação?
        </p>
        <div class="actions">
          <a class="btn" href="register.html" data-i18n="register_link">Cadastre-se</a>
          <a class="btn secondary" href="login.html" data-i18n="nav_login">Entrar</a>
        </div>
      </div>

      <!-- Catalogue public (livres aprovados) -->
      <div class="card">
        <h2 data-i18n="catalog_title">Catálogo</h2>
        <div id="books-list"><p class="muted" data-i18n="loading">Carregando…</p></div>
      </div>
    </main>

    <script type="module" src="/src/home.ts"></script>
  </body>
</html>
