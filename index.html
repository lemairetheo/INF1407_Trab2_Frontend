<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biblioteca Comunitária</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>📚 Biblioteca Comunitária</h1>
      <nav id="nav"></nav>
    </header>

    <main>
      <!-- Appel a l'action pour les visiteurs non connectes -->
      <div class="card" id="cta" hidden>
        <h2>Bem-vindo(a) à Biblioteca Comunitária</h2>
        <p>
          Explore livremente o catálogo abaixo. Quer
          <strong>sugerir um livro</strong> ou deixar uma avaliação?
        </p>
        <div class="actions">
          <a class="btn" href="register.html">Cadastre-se</a>
          <a class="btn secondary" href="login.html">Entrar</a>
        </div>
      </div>

      <!-- Catalogue public (livres aprovados) -->
      <div class="card">
        <h2>Catálogo</h2>
        <div id="books-list"><p class="muted">Carregando…</p></div>
      </div>
    </main>

    <script type="module" src="/src/home.ts"></script>
  </body>
</html>
