<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro — Biblioteca Comunitária</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="card">
        <div style="text-align: right"><span id="lang-mount"></span></div>
        <h2 data-i18n="reg_title">Criar conta</h2>
        <form id="register-form">
          <label for="username" data-i18n="f_user">Usuário</label>
          <input id="username" required autocomplete="username" />

          <label for="email" data-i18n="f_email">Email</label>
          <input id="email" type="email" required autocomplete="email" />

          <label for="password" data-i18n="f_password">Senha</label>
          <input id="password" type="password" required autocomplete="new-password" />

          <button class="btn" type="submit" data-i18n="btn_register">Cadastrar</button>
        </form>
        <div id="message"></div>
        <p class="center-link">
          <span data-i18n="have_account">Já tem conta?</span>
          <a href="login.html" data-i18n="login_link">Entrar</a>
        </p>
      </div>
    </div>
    <script type="module" src="/src/register.ts"></script>
  </body>
</html>
