<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redefinir senha — Biblioteca Comunitária</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="card">
        <h2>Redefinir senha</h2>
        <form id="reset-form">
          <label for="password">Nova senha</label>
          <input id="password" type="password" required autocomplete="new-password" />
          <button class="btn" type="submit">Redefinir</button>
        </form>
        <div id="message"></div>
        <p class="center-link"><a href="login.html">Voltar ao login</a></p>
      </div>
    </div>
    <script type="module" src="/src/reset-password.ts"></script>
  </body>
</html>
