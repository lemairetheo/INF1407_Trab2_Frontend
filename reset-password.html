<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redefinir senha — Biblioteca Comunitária</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="card">
        <div style="text-align: right"><span id="lang-mount"></span></div>
        <h2 data-i18n="reset_title">Redefinir senha</h2>
        <form id="reset-form">
          <label for="password" data-i18n="f_new_password">Nova senha</label>
          <input id="password" type="password" required autocomplete="new-password" />
          <button class="btn" type="submit" data-i18n="btn_reset">Redefinir</button>
        </form>
        <div id="message"></div>
        <p class="center-link">
          <a href="login.html" data-i18n="back_login">Voltar ao login</a>
        </p>
      </div>
    </div>
    <script type="module" src="/src/reset-password.ts"></script>
  </body>
</html>
